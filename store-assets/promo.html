<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskBridge promotional artwork</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      color: #fff;
      background:
        radial-gradient(circle at 16% 20%, rgba(36, 201, 255, .46), transparent 32%),
        radial-gradient(circle at 83% 82%, rgba(255, 42, 184, .42), transparent 38%),
        linear-gradient(135deg, #17142a 0%, #31246f 50%, #711bb8 100%);
      font-family: Arial, Helvetica, sans-serif;
    }
    .grain {
      position: absolute;
      inset: 0;
      opacity: .18;
      background-image: repeating-linear-gradient(-45deg, transparent 0 30px, rgba(255,255,255,.12) 30px 31px);
    }
    .art {
      position: relative;
      width: 88%;
      height: 78%;
      display: grid;
      grid-template-columns: minmax(220px, .8fr) minmax(360px, 1.2fr);
      align-items: center;
      gap: 7%;
    }
    .brand { position: relative; z-index: 2; }
    .icon {
      width: 118px;
      height: 118px;
      margin-bottom: 24px;
      border-radius: 28px;
      box-shadow: 0 24px 60px rgba(12, 7, 35, .36);
    }
    h1 { margin: 0; max-width: 520px; font-size: clamp(38px, 5vw, 76px); line-height: .95; letter-spacing: -.055em; }
    p { margin: 18px 0 0; max-width: 480px; color: rgba(255,255,255,.72); font-size: clamp(15px, 1.8vw, 24px); line-height: 1.35; }
    .flow { position: relative; min-height: 350px; }
    .rail {
      position: absolute;
      left: 16%;
      right: 12%;
      top: 48%;
      height: 4px;
      border-radius: 99px;
      background: linear-gradient(90deg, #2bd9ff, #9a7cff, #ff48cd);
      box-shadow: 0 0 28px rgba(131, 119, 255, .75);
    }
    .node {
      position: absolute;
      width: 42%;
      min-height: 112px;
      padding: 22px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.07));
      box-shadow: 0 22px 60px rgba(13, 7, 36, .28);
      backdrop-filter: blur(14px);
    }
    .node::before { content: ""; display: block; width: 38px; height: 8px; margin-bottom: 18px; border-radius: 99px; background: var(--color); box-shadow: 0 0 18px var(--color); }
    .node strong { display: block; font-size: clamp(16px, 1.8vw, 24px); }
    .node span { display: block; margin-top: 8px; color: rgba(255,255,255,.64); font-size: clamp(11px, 1vw, 15px); }
    .mail { --color: #2bd9ff; top: 2%; left: 0; }
    .calendar { --color: #9a7cff; top: 36%; right: 0; }
    .work { --color: #ff48cd; bottom: 0; left: 10%; }
    @media (max-width: 600px), (max-height: 340px) {
      .art { width: 86%; height: 78%; grid-template-columns: .9fr 1.1fr; gap: 4%; }
      .icon { width: 72px; height: 72px; margin-bottom: 12px; border-radius: 18px; }
      h1 { font-size: 27px; letter-spacing: -.045em; }
      p { display: none; }
      .flow { min-height: 190px; }
      .node { width: 54%; min-height: 56px; padding: 11px 13px; border-radius: 14px; }
      .node::before { width: 24px; height: 5px; margin-bottom: 8px; }
      .node strong { font-size: 12px; }
      .node span { display: none; }
      .mail { top: 0; }
      .calendar { top: 34%; }
      .work { bottom: 0; }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="art">
    <section class="brand">
      <img class="icon" src="../icons/icon-128.png" alt="">
      <h1>TaskBridge<br>for ClickUp</h1>
      <p>Correo, agenda y seguimiento conectados con el trabajo que realmente avanza.</p>
    </section>
    <section class="flow" aria-label="Flujo de trabajo conectado">
      <div class="rail" aria-hidden="true"></div>
      <article class="node mail"><strong>Correo</strong><span>Capturá contexto y adjuntos elegidos.</span></article>
      <article class="node calendar"><strong>Agenda</strong><span>Consultá tus próximos eventos.</span></article>
      <article class="node work"><strong>Trabajo</strong><span>Tareas y tiempo visibles en ClickUp.</span></article>
    </section>
  </main>
</body>
</html>
