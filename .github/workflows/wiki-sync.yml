name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'TECHNICAL_DOCS.md'
      - 'USER_GUIDE.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'PRIVACY_POLICY.md'
      - 'CHANGELOG.md'
      - '.github/workflows/wiki-sync.yml'

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Wiki Content
        run: |
          mkdir -p wiki_content
          cp TECHNICAL_DOCS.md wiki_content/Technical-Documentation.md
          cp USER_GUIDE.md wiki_content/User-Guide.md
          [ -f SECURITY.md ] && cp SECURITY.md wiki_content/Security.md || true
          [ -f CONTRIBUTING.md ] && cp CONTRIBUTING.md wiki_content/Contributing.md || true
          [ -f PRIVACY_POLICY.md ] && cp PRIVACY_POLICY.md wiki_content/Privacy-Policy.md || true
          [ -f CHANGELOG.md ] && cp CHANGELOG.md wiki_content/Release-History.md || true
          
          # Create Home.md if it doesn't exist
          cat > wiki_content/Home.md << 'EOF'
          # TaskBridge for ClickUp Wiki

          TaskBridge connects Gmail, Google Calendar, Google Meet, and ClickUp for task creation, linking, agenda planning, and time tracking.

          **Current source version:** 2.2.0

          ## 📚 Pages

          - [[User Guide]] - Installation and feature usage
          - [[Technical Documentation]] - Architecture, security, and API details
          - [[Contributing]] - How to contribute
          - [[Security]] - Security policy and reporting
          - [[Privacy Policy]] - Data use and Chrome permission disclosure
          - [[Release History]] - Version history and release notes

          ## 🔗 Quick Links

          - [GitHub Repository](https://github.com/Diramain/taskbridge-for-clickup)
          - [Releases](https://github.com/Diramain/taskbridge-for-clickup/releases)
          - [Issues](https://github.com/Diramain/taskbridge-for-clickup/issues)
          - [Send feedback](https://github.com/Diramain/taskbridge-for-clickup/issues/new/choose)
          - [Report a vulnerability privately](https://github.com/Diramain/taskbridge-for-clickup/security/advisories/new)
          - [Chrome Web Store](https://chromewebstore.google.com/detail/gihebfjgjfnglhadpeemhpdoamklckdg)
          EOF

      - name: Sync Documents to Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: wiki_content
